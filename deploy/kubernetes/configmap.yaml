apiVersion: v1
kind: ConfigMap
metadata:
  name: outwarp-config
  namespace: outwarp
# All values below are EXAMPLES — edit them before `kubectl apply`. The server
# bakes OUTWARP_ENDPOINT and OUTWARP_PORT into every generated .owcfg, so any
# change here means you must re-run `outwarp-server add-client` for new
# clients to pick the new values up.
data:
  # Endpoint that goes into every .owcfg as the WSS target. Use a DNS name if
  # you have one, otherwise your server's public IPv4 address. Clients will
  # add a static bypass route to this host so wstunnel traffic never enters
  # the WireGuard tunnel itself.
  OUTWARP_ENDPOINT: "your-server.example.com"
  # WSS port wstunnel listens on. Default is 443 to mimic plain HTTPS; pick a
  # different value if another service already owns 443 on the same node (e.g.
  # a Caddy / Traefik ingress). Whatever you pick must be open on the public
  # internet — port-forward on a home router or open the security-group rule
  # on a VPS.
  OUTWARP_PORT: "443"
  # WireGuard server's UDP listen port. Loopback-only (wstunnel forwards to
  # 127.0.0.1:<this>) so no router rule is needed. Change it if another wg-*
  # process on the host already binds 51820.
  OUTWARP_WG_PORT: "51820"
  # WireGuard subnet for OutWarp clients. Must NOT overlap any LAN, k8s pod /
  # service CIDR or other VPN subnet the clients will reach.
  OUTWARP_SUBNET: "10.0.0.0/24"
  # Server's address inside that subnet. Convention: first usable host.
  OUTWARP_SERVER_ADDRESS: "10.0.0.1/24"
