apiVersion: v1
kind: ConfigMap
metadata:
  name: outwarp-config
  namespace: outwarp
data:
  # Endpoint that goes into every .owcfg as the WSS target.
  OUTWARP_ENDPOINT: "wg.fcrespo.tech"
  # WSS port wstunnel listens on. Picked so it doesn't collide with the
  # existing caddy (80) or wg-easy (51820/UDP) on this Pi. You need to add
  # a port-forward on your router: TCP 8443 → 192.168.1.210:8443.
  OUTWARP_PORT: "8443"
  # WireGuard server's UDP listen port. Default 51820 is already bound on the
  # host by wg-easy's hostPort, so OutWarp uses 51822 instead. This port is
  # loopback-only (wstunnel forwards to 127.0.0.1:51822) — no router rule
  # needed.
  OUTWARP_WG_PORT: "51822"
  # WireGuard subnet for OutWarp clients. wg-easy uses 10.8.0.0/24, so we
  # pick a non-overlapping range to keep routing tables clean if any client
  # ever holds both profiles.
  OUTWARP_SUBNET: "10.9.0.0/24"
  OUTWARP_SERVER_ADDRESS: "10.9.0.1/24"
