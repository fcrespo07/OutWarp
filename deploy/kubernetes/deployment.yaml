apiVersion: apps/v1
kind: Deployment
metadata:
  name: outwarp-server
  namespace: outwarp
  labels:
    app: outwarp-server
spec:
  replicas: 1  # WireGuard is stateful — never scale horizontally
  # Recreate (not RollingUpdate): with hostNetwork the surge pod can't bind the
  # same host :443 as the running one, so a rolling update would deadlock. Kill
  # the old pod first, then start the new — a brief VPN reconnect on each roll.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: outwarp-server
  template:
    metadata:
      labels:
        app: outwarp-server
    spec:
      # hostNetwork binds wstunnel directly to the Pi's NIC — no kube-proxy
      # NAT overhead and no port conflicts with klipper-lb or Traefik.
      # The WireGuard interface (wg0) is created in the HOST network namespace,
      # which is correct for a VPN server: traffic flows Pi ↔ clients directly.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      initContainers:
        - name: outwarp-init
          image: ghcr.io/fcrespo07/outwarp-server:main
          # `:main` is the rolling tag rebuilt on every push to main. For
          # pinned releases switch to `:0.5.5` (built when a `v0.5.5` git tag
          # exists — see .github/workflows/docker-publish.yml).
          imagePullPolicy: Always
          command: ["outwarp-server", "--config-dir", "/data", "init"]
          envFrom:
            - configMapRef:
                name: outwarp-config
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: data
              mountPath: /data

        # Mints the web panel's admin token on first boot. Idempotent: it only
        # generates one when /data/admin_token.json is missing, so pod restarts
        # never rotate it. Read the token once from this container's logs:
        #   kubectl -n outwarp logs <pod> -c outwarp-token
        - name: outwarp-token
          image: ghcr.io/fcrespo07/outwarp-server:main
          imagePullPolicy: Always
          command: ["outwarp-server", "--config-dir", "/data", "admin-token"]
          volumeMounts:
            - name: data
              mountPath: /data

      containers:
        - name: outwarp-server
          image: ghcr.io/fcrespo07/outwarp-server:main
          # `:main` is the rolling tag rebuilt on every push to main. For
          # pinned releases switch to `:0.5.5` (built when a `v0.5.5` git tag
          # exists — see .github/workflows/docker-publish.yml).
          imagePullPolicy: Always
          command: ["outwarp-server", "--config-dir", "/data", "serve"]
          envFrom:
            - configMapRef:
                name: outwarp-config
          securityContext:
            capabilities:
              add:
                - NET_ADMIN  # wg-quick + iptables MASQUERADE
                - NET_RAW    # iptables raw table (MASQUERADE on some kernels)
          # Pi 5 has plenty of headroom; these limits prevent a runaway process
          # from starving other pods while leaving >7 GB free for the OS + k3s.
          resources:
            requests:
              cpu: "100m"
              memory: "96Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            tcpSocket:
              # Must match OUTWARP_PORT in the ConfigMap.
              port: 443
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            # emptyDir so /etc/wireguard is always fresh on pod restart — wg0.conf
            # is regenerated from /data/server_config.json by `serve` at startup.
            - name: wireguard
              mountPath: /etc/wireguard

        # Remote web admin panel (HTTPS). A sidecar in the SAME pod so it shares
        # the host network namespace (sees wg0 for live client hot-reload) and
        # the /data PVC (TLS cert + config + admin token). Expose it through
        # your own ingress/tunnel — e.g. a Cloudflare Tunnel public hostname →
        # Caddy `reverse_proxy https://<host>:9443 { transport http { tls_insecure_skip_verify } }`.
        # NOTE: service start/stop/restart in the panel act on this container's
        # own manager, not the `serve` process — status may read "stopped" while
        # the VPN is up. Client add/revoke and all read views work live.
        - name: outwarp-panel
          image: ghcr.io/fcrespo07/outwarp-server:main
          imagePullPolicy: Always
          command:
            ["outwarp-server", "--config-dir", "/data", "web", "--host", "0.0.0.0", "--port", "9443"]
          securityContext:
            capabilities:
              add:
                - NET_ADMIN  # wg syncconf on live client add/revoke
                - NET_RAW
          resources:
            requests:
              cpu: "25m"
              memory: "48Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: wireguard
              mountPath: /etc/wireguard

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: outwarp-server-data
        - name: wireguard
          emptyDir: {}
