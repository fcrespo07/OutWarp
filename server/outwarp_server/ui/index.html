<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <title>OutWarp Server</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <!-- No CDN: the server GUI may run on a fresh VPS before the firewall
       allows outbound HTTP, so React is vendored and JSX is pre-compiled
       to ui/bundle.js by scripts/build_ui.py. Fonts fall back to the
       system stack defined in styles.css. -->
  <link rel="stylesheet" href="styles.css"/>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
    #root { height: 100%; }
  </style>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script src="bundle.js"></script>
</body>
</html>
