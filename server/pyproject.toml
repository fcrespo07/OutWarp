[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outwarp-server"
version = "0.10.0"
description = "Servidor CLI para tuneles WireGuard sobre WebSocket (wstunnel)"
requires-python = ">=3.11"
authors = [
  { name = "Ferran Crespo", email = "fcrespo@fcrespo.tech" },
  { name = "Ferran Crespo", email = "fcrespo@fcrespo.dev" },
]
keywords = ["wireguard", "wstunnel", "vpn", "server", "tunnel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]
dependencies = [
    "rich>=13.0",
    "cryptography>=42.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# Admin pywebview GUI for macOS/Windows administrators. On Linux the
# `outwarp-server tui` Textual interface replaces it and pulls no
# webkit2gtk dependency — install.sh installs the `[tui]` extra by
# default, and an admin who really wants the GTK GUI can opt in with
# `pip install 'outwarp-server[gui-linux]'`.
gui = [
    "pillow>=10.0",
    "pystray>=0.19",
    "pywebview>=5.0 ; sys_platform != 'linux'",
]
gui-linux = [
    "pillow>=10.0",
    "pystray>=0.19",
    "pywebview>=5.0",
]
dev = [
    "ruff>=0.5",
    "black>=24.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
tui = [
    "textual>=0.85",
    "qrcode>=7.4",
    "argcomplete>=3.0",
]
build = [
    "build>=1.0",
]

[project.scripts]
# Single server entry-point as of 0.5.0. The admin GUI now lives behind
# ``outwarp-server gui``.
outwarp-server = "outwarp_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["outwarp_server"]
# See the matching block in client/pyproject.toml — defensive excludes only.
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "**/.DS_Store",
    "**/*.swp",
    "outwarp_server/tests",
    "outwarp_server/**/tests",
]

[tool.hatch.build.targets.sdist]
include = [
    "outwarp_server/",
    "tests/",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "dist/",
    "build/",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
