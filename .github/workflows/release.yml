name: Release

# Builds the Linux wheels, creates (or refreshes) the **draft** GitHub Release
# for a tag, then builds the Windows installers into the same draft — the CI
# counterpart of scripts/release.sh for environments without a local `gh`
# login.
#
# Releases are immutable once published (repo setting): assets and tag are
# frozen. So nothing here publishes. The maintainer signs SHA256SUMS.txt
# offline, uploads the .minisig and publishes with scripts/publish-release.sh,
# which checks every asset against the signed manifest first.
# See docs/RELEASE_SIGNING.md.
#
# Triggers:
#   - push of a v* tag      → drafts that tag.
#   - workflow_dispatch     → (re)draft any tag that is not published yet.
#
# Release notes come from the matching `## [x.y.z]` section in CHANGELOG.md,
# same extraction as release.sh.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)draft, e.g. v0.15.0 (must not be published yet)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      # A draft only creates its tag when published: without one, the Windows
      # job builds the same commit by SHA.
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          [ -n "$tag" ] || { echo "no tag resolved" >&2; exit 1; }
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            echo "target=" >> "$GITHUB_OUTPUT"
          else
            # Tag doesn't exist yet (dispatch from a branch): build the
            # dispatched commit and let `gh release create --target` create
            # the tag there.
            echo "ref=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "target=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout the tagged sources
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheels
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist client
          python -m build --wheel --outdir dist server

      - name: Verify wheel versions match the tag
        run: |
          v="${{ steps.tag.outputs.version }}"
          ls "dist/outwarp_client-${v}-py3-none-any.whl" \
             "dist/outwarp_server-${v}-py3-none-any.whl"

      - name: Generate SHA256SUMS.txt
        run: |
          cd dist
          sha256sum outwarp_client-*.whl outwarp_server-*.whl > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        run: |
          v="${{ steps.tag.outputs.version }}"
          awk -v tag="[$v]" '
              /^## / { if (started) exit; if (index($0, tag)) started=1 }
              started { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            printf '## v%s\n' "$v" > notes.md
          fi
          {
            echo
            echo "---"
            echo
            echo "### Install / upgrade"
            echo
            echo "Linux (client or server):"
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/fcrespo07/OutWarp/main/installer/linux/install.sh | sudo bash"
            echo '```'
            echo "Or upgrade in place:"
            echo '```'
            echo "sudo outwarp update      # client"
            echo "sudo outwarp-server update   # server"
            echo '```'
            echo
            echo 'Windows: download the matching `OutWarpSetup-*.exe` below and run it.'
            echo 'Verify any asset against `SHA256SUMS.txt`.'
          } >> notes.md

      - name: Create or update the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          target="${{ steps.tag.outputs.target }}"
          assets="dist/outwarp_client-*.whl dist/outwarp_server-*.whl dist/SHA256SUMS.txt"
          if draft=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$tag is already published; releases are immutable. Bump the version instead." >&2
              exit 1
            fi
            gh release edit "$tag" --notes-file notes.md
            # shellcheck disable=SC2086
            gh release upload "$tag" $assets --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$tag" --draft --title "$tag" --notes-file notes.md \
              ${target:+--target "$target"} $assets
          fi

  windows:
    needs: release
    uses: ./.github/workflows/windows-installer.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      ref: ${{ needs.release.outputs.ref }}
    permissions:
      contents: write
