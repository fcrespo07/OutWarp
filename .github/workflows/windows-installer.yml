name: Windows installer

# Builds the OutWarp Windows installers (full + client + server editions) and
# attaches them to the draft GitHub Release, so the .exe stops being a manual
# step.
#
# Releases are immutable once published (repo setting), so every asset —
# wheels, installers, SHA256SUMS.txt and its .minisig — has to land while the
# release is still a draft. Hence no `release: published` trigger: by then it
# is too late to attach anything. See docs/RELEASE_SIGNING.md.
#
# Triggers:
#   - workflow_call       → from release.yml, right after it creates the draft.
#   - workflow_dispatch   → manual run against an existing draft (e.g. after a
#     runner hiccup, or after scripts/release.sh created the draft locally).
#
# The build itself (UI bundle → fetch wstunnel/WireGuard → PyInstaller → Inno
# Setup → checksums) lives in installer/windows/build/build.py; this workflow
# only provides the Windows runner + toolchain and uploads the artifacts.

on:
  workflow_call:
    inputs:
      tag:
        description: "Draft release tag to attach the installers to"
        required: true
        type: string
      ref:
        description: "Git ref to build (defaults to the tag; a SHA when the tag only exists once the draft is published)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to build and attach the installer to (e.g. v0.15.0)"
        required: true
      ref:
        description: "Git ref to build (leave empty to build the tag)"
        required: false
        default: ""

permissions:
  contents: write   # upload assets to the release

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Resolve tag and refuse a published release
        id: tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { throw "no tag given" }
          $ref = "${{ inputs.ref }}"
          if (-not $ref) { $ref = $tag }
          $draft = gh release view $tag --json isDraft -q .isDraft
          if ($LASTEXITCODE -ne 0) { throw "no release for $tag - create the draft first (release.yml or scripts/release.sh)" }
          if ($draft -ne "true") {
            throw "$tag is already published; releases are immutable, so its assets cannot change. Ship a new version instead."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "ref=$ref" >> $env:GITHUB_OUTPUT
          Write-Host "Building installers for draft $tag from $ref"

      - name: Checkout the release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installers
        shell: pwsh
        run: python installer/windows/build/build.py
        # No --version: build.py defaults to __version__ in the checked-out
        # tag, and refreshes the PE VS_VERSION_INFO + Inno /DAppVersion from it.

      - name: List build output
        shell: pwsh
        run: Get-ChildItem installer/windows/output

      - name: Merge Windows checksums into the release SHA256SUMS.txt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          # Both updaters read ONE SHA256SUMS.txt per release and look an asset up
          # by name, so the manifest must list the wheels (uploaded by release.sh)
          # AND the .exe installers. Pull the existing wheel manifest and merge.
          gh release download $tag --pattern "SHA256SUMS.txt" --output existing.txt
          $global:LASTEXITCODE = 0   # missing asset is fine; we start from empty
          if (-not (Test-Path existing.txt)) { New-Item existing.txt -ItemType File | Out-Null }
          $merged = Get-Content existing.txt, installer/windows/output/SHA256SUMS.txt `
            | Where-Object { $_.Trim() -ne "" } | Sort-Object -Unique
          $merged | Set-Content -Encoding ascii installer/windows/output/SHA256SUMS.txt
          Write-Host "Merged manifest:"
          Get-Content installer/windows/output/SHA256SUMS.txt

      - name: Upload installers + merged checksums to the draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $exes = Get-ChildItem installer/windows/output/OutWarpSetup-*.exe
          if (-not $exes) { throw "no OutWarpSetup-*.exe produced" }
          gh release upload $tag $exes.FullName installer/windows/output/SHA256SUMS.txt --clobber
          # The manifest just changed, so any signature already attached to this
          # release now covers the old content. Drop it rather than leave a stale
          # one that would fail verification in a confusing way.
          gh release delete-asset $tag SHA256SUMS.txt.minisig --yes 2>$null
          $global:LASTEXITCODE = 0

      - name: Remind the maintainer to sign the manifest
        shell: pwsh
        run: |
          # Signing happens on the maintainer's machine, never here: a key CI
          # could reach would be a key an attacker who owns CI could reach, and
          # the signature would prove nothing. See docs/RELEASE_SIGNING.md.
          Write-Host "::notice::SHA256SUMS.txt is final. Sign it locally, upload SHA256SUMS.txt.minisig and publish with scripts/publish-release.sh — see docs/RELEASE_SIGNING.md"

      - name: Upload installers as workflow artifacts (debugging)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OutWarp-windows-installers-${{ steps.tag.outputs.tag }}
          path: installer/windows/output/OutWarpSetup-*.exe
          if-no-files-found: error
