name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when a new commit lands on the same ref. Saves CI
# minutes on rapid push cycles (style fixups, force-pushes from rebase).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The project declares `requires-python = ">=3.11"` in both wheels;
        # we exercise the full supported range so a 3.12/3.13-only syntax or
        # stdlib change (e.g. `subprocess.CompletedProcess` repr) gets caught
        # before a user hits it.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install client (with TUI + dev extras)
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[tui,dev]'

      - name: Run client tests
        working-directory: client
        # tests/test_platforms.py imports outwarp.platforms.windows at module
        # scope, which references subprocess.CREATE_NO_WINDOW — only defined
        # on Windows. Skipping the file on Linux runners is the simplest
        # cross-platform escape hatch; the suite reaches the same coverage on
        # a Windows runner whenever we add one.
        run: pytest -q --ignore=tests/test_platforms.py

      - name: Install server (with TUI + dev extras)
        working-directory: server
        run: pip install -e '.[tui,dev]'

      - name: Run server tests
        working-directory: server
        # Same Windows-only import problem as the client (see note above):
        # outwarp_server.platforms.windows touches subprocess.CREATE_NO_WINDOW
        # at module scope, so its companion test file can't load on Linux.
        run: pytest -q --ignore=tests/test_platforms.py

  lint:
    name: ruff (informational)
    runs-on: ubuntu-latest
    # Lint is non-blocking for now: the codebase carries pre-existing ruff
    # debt that CLAUDE.md documents and a future "lint cleanup" PR will
    # tackle in isolation. The job still runs so new violations are visible
    # in the PR check list — just not gating.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install 'ruff>=0.5'

      - name: ruff check (client)
        working-directory: client
        run: ruff check .

      - name: ruff check (server)
        working-directory: server
        run: ruff check .

  build-wheels:
    name: build wheels
    runs-on: ubuntu-latest
    # Catches a broken pyproject.toml / missing data files (icon, .tcss, woff2)
    # before they ship — `install.sh` downloads exactly these wheels from a
    # release, so a wheel that builds but excludes a runtime resource silently
    # breaks the installer.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build backend
        run: pip install 'build>=1.0'

      - name: Build client wheel
        working-directory: client
        run: python -m build --wheel

      - name: Build server wheel
        working-directory: server
        run: python -m build --wheel

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: |
            client/dist/*.whl
            server/dist/*.whl
          retention-days: 7
