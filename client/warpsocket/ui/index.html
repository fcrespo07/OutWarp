<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WarpSocket — placeholder UI</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; padding: 24px; max-width: 880px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { color: #888; margin-bottom: 24px; font-size: 13px; }
    section { border: 1px solid #ccc4; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    section h2 { margin: 0 0 12px; font-size: 15px; }
    button { padding: 8px 14px; border-radius: 6px; border: 1px solid #888; background: #fff2; cursor: pointer; margin-right: 6px; margin-bottom: 6px; }
    button:hover { background: #8884; }
    .danger { border-color: #c0392b; color: #c0392b; }
    pre { background: #0001; padding: 10px; border-radius: 6px; overflow: auto; max-height: 220px; font-size: 12px; margin: 0; }
    .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #888; vertical-align: middle; margin-right: 6px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    code { font-size: 12px; }
    input[type=file] { font-size: 13px; }
  </style>
</head>
<body>
  <h1>WarpSocket</h1>
  <div class="sub">UI provisional. El diseño final llega en la siguiente iteración (Claude Design).</div>

  <section>
    <h2><span class="status-dot" id="dot"></span><span id="status-label">cargando…</span></h2>
    <div id="status-detail" class="sub"></div>
    <div class="row">
      <button id="btn-connect">Conectar</button>
      <button id="btn-disconnect">Desconectar</button>
      <button id="btn-reconnect">Reconectar</button>
    </div>
  </section>

  <section>
    <h2>Importar .warpcfg</h2>
    <div class="row">
      <input type="file" id="warpcfg-input" accept=".warpcfg,.json" />
      <button id="btn-import">Importar</button>
    </div>
    <div id="import-result" class="sub" style="margin-top:8px"></div>
  </section>

  <section>
    <h2>Logs</h2>
    <pre id="logs"></pre>
  </section>

<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const authHeaders = { "Authorization": `Bearer ${TOKEN}` };

const STATE_COLORS = {
  no_config: "#888", disconnected: "#888",
  connecting: "#FFC800", reconnecting: "#FF9600",
  connected: "#00C800", failed: "#DC0000",
};

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...authHeaders, ...(opts.headers || {}) } });
  if (!r.ok && r.status !== 202) {
    let detail = "";
    try { detail = (await r.json()).detail || (await r.text()); } catch (e) {}
    throw new Error(`${r.status} ${r.statusText} — ${detail}`);
  }
  if (r.status === 202) return null;
  return r.json();
}

async function refreshStatus() {
  try {
    const s = await api("/api/status");
    document.getElementById("dot").style.background = STATE_COLORS[s.state] || "#888";
    document.getElementById("status-label").textContent = s.state;
    document.getElementById("status-detail").textContent =
      s.config_present ? `${s.server_endpoint} · ${s.tunnel_name}` : "Sin configuración";
  } catch (e) {
    document.getElementById("status-label").textContent = "error";
    document.getElementById("status-detail").textContent = e.message;
  }
}

document.getElementById("btn-connect").onclick = async () => { await api("/api/connect", { method: "POST" }); await refreshStatus(); };
document.getElementById("btn-disconnect").onclick = async () => { await api("/api/disconnect", { method: "POST" }); await refreshStatus(); };
document.getElementById("btn-reconnect").onclick = async () => { await api("/api/reconnect", { method: "POST" }); await refreshStatus(); };

document.getElementById("btn-import").onclick = async () => {
  const inp = document.getElementById("warpcfg-input");
  if (!inp.files || !inp.files[0]) {
    document.getElementById("import-result").textContent = "Selecciona un archivo .warpcfg primero.";
    return;
  }
  const fd = new FormData();
  fd.append("file", inp.files[0]);
  try {
    const r = await fetch("/api/import-config", { method: "POST", headers: authHeaders, body: fd });
    const data = await r.json();
    if (!r.ok) {
      document.getElementById("import-result").textContent = `Error: ${data.error || r.statusText}`;
      return;
    }
    document.getElementById("import-result").textContent =
      `Importado: ${data.config.server.endpoint}:${data.config.server.port}`;
    await refreshStatus();
  } catch (e) {
    document.getElementById("import-result").textContent = `Error: ${e.message}`;
  }
};

const logsBox = document.getElementById("logs");
const ws = new WebSocket(`ws://${location.host}/api/ws/logs?token=${encodeURIComponent(TOKEN)}`);
ws.onmessage = (ev) => {
  const data = JSON.parse(ev.data);
  logsBox.textContent += data.line + "\n";
  logsBox.scrollTop = logsBox.scrollHeight;
};
ws.onerror = () => { logsBox.textContent += "[ws error]\n"; };

refreshStatus();
setInterval(refreshStatus, 2000);
</script>
</body>
</html>
