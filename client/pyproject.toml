[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outwarp-client"
version = "0.11.0"
description = "Cliente de bandeja multiplataforma para tuneles WireGuard sobre WebSocket (wstunnel)"
requires-python = ">=3.11"
authors = [
  { name = "Ferran Crespo", email = "fcrespo@fcrespo.tech" },
  { name = "Ferran Crespo", email = "fcrespo@fcrespo.dev" },
]
keywords = ["wireguard", "wstunnel", "vpn", "tray", "tunnel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: System :: Networking",
]
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "platformdirs>=4.0",
    # pywebview is the GUI tray renderer on macOS/Windows; on Linux the
    # primary UI is the Textual TUI (`outwarp-cli tui`), which has no
    # WebKit dependency. The PEP 508 marker keeps Linux wheels free of
    # the webkit2gtk stack — users who still want the tray GUI can opt
    # in with `pip install 'outwarp-client[gui-linux]'`.
    "pywebview>=5.0 ; sys_platform != 'linux'",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "black>=24.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
build = [
    "pyinstaller>=6.0",
    "build>=1.0",
]
tui = [
    "textual>=0.85",
    "rich>=13.0",
    "argcomplete>=3.0",
]
# Opt-in extra for Linux users who still want the pywebview tray GUI
# instead of the TUI. Activated via `pip install outwarp-client[gui-linux]`
# or by passing OUTWARP_CLIENT_GUI=1 to install.sh in a future revision.
gui-linux = [
    "pywebview>=5.0",
]

[project.scripts]
# Single Linux entry-point as of 0.5.0. The tray/GUI now lives behind
# ``outwarp-cli gui`` and the legacy ``outwarp-uninstall`` is reachable as
# ``outwarp-cli uninstall``.
outwarp-cli = "outwarp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["outwarp"]
# Defensive excludes: Hatchling already ships every file under outwarp/ by
# default (UI assets, fonts, icons, .tcss), but without an explicit exclude
# block a stray __pycache__/, editor swap, or accidental tests/ symlink could
# leak into a published wheel. Keep this list tight.
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "**/.DS_Store",
    "**/*.swp",
    "outwarp/tests",
    "outwarp/**/tests",
]

[tool.hatch.build.targets.sdist]
include = [
    "outwarp/",
    "tests/",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
    "dist/",
    "build/",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# minisign.py transcribes the RFC 8032 §6 reference implementation, whose
# single-letter uppercase names (P, Q, A, R, ...) are the notation the spec uses
# for curve points. Renaming them to satisfy N806 would make the code
# impossible to check line-by-line against the document it came from.
"outwarp/minisign.py" = ["N803", "N806"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
