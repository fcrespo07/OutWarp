  <!-- No CDN: OutWarp is a VPN client and must render even with no working
       network. React/ReactDOM/Babel are vendored under ui/vendor/, and the
       font stack falls back to the system UI font (Segoe UI / -apple-system). -->
  <link rel="stylesheet" href="styles.css"/>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
    #root { height: 100%; }
  </style>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Pass-through replacement for the design canvas' WindowsFrame.
    // The native pywebview window already provides chrome.
    window.WindowsFrame = ({ children }) => <div style={{ height: "100%", width: "100%" }}>{children}</div>;
  </script>

  <script type="text/babel" src="brand.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="var-a.jsx"></script>
  <script type="text/babel" src="var-b.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
